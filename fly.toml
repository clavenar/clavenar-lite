# fly.toml — clavenar-lite deploy template
#
# `fly launch` will pick this up. Override `app` to your own slug
# (Fly requires globally-unique app names; this template uses a
# placeholder).
#
# The hosted profile is intentionally fail-closed. The machine will not become
# ready until distinct agent/operator secrets and a real HTTPS MCP JSON-RPC
# upstream replace the placeholder values.

app = "clavenar-lite"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
dockerfile = "Dockerfile"

[env]
CLAVENAR_LITE_DEPLOYMENT_PROFILE = "hosted"
CLAVENAR_LITE_MODE = "enforce"
CLAVENAR_LITE_LEDGER = "/data/clavenar-lite.db"
CLAVENAR_LITE_RATE_LIMIT_QPS = "10"
CLAVENAR_LITE_RATE_LIMIT_BURST = "20"
CLAVENAR_LITE_UPSTREAM_TIMEOUT_SECS = "30"
CLAVENAR_LITE_UPSTREAM_ADAPTER = "mcp-jsonrpc-v1"
CLAVENAR_LITE_UPSTREAM_URL = "https://replace-me.invalid/mcp"
RUST_LOG = "info"

[[mounts]]
source = "clavenar_lite_data"
destination = "/data"

[http_service]
internal_port = 8088
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[http_service.checks]]
grace_period = "5s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/"

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
cpus = 1
