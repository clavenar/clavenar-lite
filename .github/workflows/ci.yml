name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Refresh advisory data even when the repository is otherwise idle.
  schedule:
    - cron: '17 3 * * 0'

jobs:
  ci:
    name: cargo check / test / clippy
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Prepare isolated Rust toolchain state
        run: |
          suffix="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          job_home="$RUNNER_TEMP/home-$suffix"
          install -d -m 0700 "$job_home"
          {
            echo "CARGO_HOME=$RUNNER_TEMP/cargo-home-$suffix"
            echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-home-$suffix"
          } >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        env:
          HOME: ${{ runner.temp }}/home-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo test
        run: cargo test

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  # End-to-end smoke. Builds the runtime image from the working tree
  # and runs scripts/smoke-e2e.sh against it — three verdicts, the
  # yellow-tier park-poll-decide loop, decide-token gating, and the
  # concurrent audit-CLI read that proves WAL works. The gate the
  # partner-day-1 README walks through; CI fails if any check trips.
  smoke-e2e:
    name: smoke-e2e (boot + verdicts + audit)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Tag the locally-built image under the same coordinates the
      # smoke script expects (`ghcr.io/clavenar/clavenar-lite:ci`)
      # so the script doesn't need a CI-specific branch.
      - name: Build runtime image
        run: docker build -t ghcr.io/clavenar/clavenar-lite:ci .

      - name: Run smoke-e2e
        env:
          CLAVENAR_LITE_VERSION: ci
        run: ./scripts/smoke-e2e.sh

  # Supply-chain gate. cargo-deny runs four checks against `deny.toml` at
  # the repo root: advisories (RUSTSEC vulns + unmaintained), licenses
  # (allow-list), bans (multiple-version warnings), sources (only
  # crates.io). The deny.toml file is synced verbatim across all 14 Rust
  # repos — edit clavenar-specs first if policy changes, then mirror into
  # every other repo.
  supply-chain:
    name: cargo-deny + cyclonedx SBOM
    # The dependency graph is deterministic for a pinned Cargo.lock. Audit it
    # on review, on demand, and weekly as the advisory database changes.
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0

      # Run both tools host-side. Container actions cannot use the isolated
      # per-job CARGO_HOME/RUSTUP_HOME paths created by the main build job.
      - uses: cargo-bins/cargo-binstall@ead08b90bd7b2e6d81963fb9cf0b7239f66d5db4 # main

      - name: install cargo-deny + cargo-cyclonedx
        run: cargo binstall --no-confirm cargo-deny@0.20.2 cargo-cyclonedx@0.5.9

      - name: cargo-deny check all
        run: cargo deny check all

      - name: generate SBOM
        run: cargo cyclonedx --format json --describe crate

      - name: upload SBOM
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sbom-${{ github.event.repository.name }}-${{ github.sha }}
          path: '*.cdx.json'
          if-no-files-found: error
          retention-days: 90
