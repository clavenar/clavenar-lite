name: release
run-name: publish ${{ github.event.client_payload.publication_id }}
#
# What this ships:
#   1. Multi-arch container image (linux/amd64 + linux/arm64) at
#      ghcr.io/clavenar/clavenar-lite:{version}.
#   2. Static linux-x86_64 binary (musl) as a release asset, for
#      partners who want the binary outside a container.
#   3. A GitHub release with the matching CHANGELOG.md section as
#      the release body.
#
on:
  repository_dispatch:
    types: [clavenar-protected-publication]

permissions:
  contents: write   # required for `gh release create`
  packages: write   # required to push to ghcr.io

jobs:
  release:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.client_payload.source_sha }}

      - name: Isolate Rust toolchain state
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-home-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-home-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" >> "$GITHUB_ENV"

      - name: Verify protected publication input
        id: ver
        env:
          COMPONENT_VERSION: ${{ github.event.client_payload.component_version }}
          RELEASE_REFERENCE: ${{ github.event.client_payload.release_reference }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          test "$GITHUB_ACTOR" = "vanteguardlabs"
          [[ "$RELEASE_REFERENCE" =~ ^ghcr\.io/clavenar/clavenar-stack-release@sha256:[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          TAG="$COMPONENT_VERSION"
          CARGO_VERSION=$(grep -E '^version = ' Cargo.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "::error::protected component version $TAG does not match Cargo.toml ($CARGO_VERSION)"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0
          targets: x86_64-unknown-linux-musl
          components: rustfmt, clippy

      - name: Verify the exact Lite source before publication
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push multi-arch image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/clavenar/clavenar-lite:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract CHANGELOG section for this version
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Pull the lines from "## [VERSION]" up to (not including) the
          # next "## [" header. We use `index($0, hdr)` for a literal
          # substring match — the alternative regex form ($0 ~ ...)
          # treats brackets as a character class and silently matches
          # nothing for `[X.Y.Z]`-style version headers.
          awk -v hdr="## [$VERSION] -" \
              'index($0, hdr) == 1 { flag=1; print; next }
               /^## \[/ && flag { exit }
               flag' \
              CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no CHANGELOG section found for $VERSION"
            exit 1
          fi
          echo "---release-notes.md---"
          cat release-notes.md

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: musl-release

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build static linux-x86_64 binary
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          BIN=target/x86_64-unknown-linux-musl/release/clavenar-lite
          file "$BIN"
          # Sanity: assert it really is static — dynamic libc linkage
          # defeats the entire reason we ship a musl build.
          if ldd "$BIN" 2>&1 | grep -qE '=>'; then
            echo "::error::binary is not statically linked"
            ldd "$BIN" || true
            exit 1
          fi
          VERSION="${{ steps.ver.outputs.version }}"
          ASSET="clavenar-lite-${VERSION}-x86_64-linux-musl.tar.gz"
          tar -czf "$ASSET" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          sha256sum "$ASSET" | tee "${ASSET}.sha256"
          echo "asset=$ASSET" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
              --jq '.object.sha')" = "$SOURCE_SHA"
            gh release upload "$tag" "$asset" "${asset}.sha256" --clobber
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
                --jq '.object.sha')" = "$SOURCE_SHA"
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$tag" \
                -f sha="$SOURCE_SHA" >/dev/null
            fi
            gh release create "$tag" \
              --title "$tag — clavenar-lite" \
              --notes-file release-notes.md \
              "$asset" \
              "${asset}.sha256"
          fi
